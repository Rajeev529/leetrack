{% extends 'base.html' %}

{% block title %}Edit Profile | Leettrack{% endblock %}

{% block content %}
<main class="max-w-2xl mx-auto px-4 py-16">
    <div class="mb-8">
        <a href="{% url 'profile' %}" class="text-slate-500 hover:text-white transition-colors flex items-center gap-2 text-sm font-medium mb-4">
            <i class="fa-solid fa-arrow-left"></i> Back to Profile
        </a>
        <h1 class="text-3xl font-black text-white tracking-tight">Edit Profile</h1>
        <p class="text-slate-400 mt-1">Update your personal information and email address.</p>
    </div>

    <div class="glass p-8 rounded-3xl border border-slate-800">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">First Name</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}"
                           class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none"
                           placeholder="John">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Last Name</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}"
                           class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none"
                           placeholder="Doe">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Email Address</label>
                <input type="email" name="email" value="{{ user.email }}" required
                       class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none"
                       placeholder="john@example.com">
            </div>

            <div class="flex items-center justify-end gap-4 pt-6 border-t border-slate-800 mt-8">
                <a href="{% url 'profile' %}" class="px-6 py-3 rounded-xl text-sm font-bold text-slate-400 hover:text-white transition-colors">
                    Cancel
                </a>
                <button type="submit" class="bg-blue-600 text-white px-8 py-3 rounded-xl text-sm font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-600/20">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
