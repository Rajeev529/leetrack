{% extends 'base.html' %}

{% block title %}Search Companies | Leettrack{% endblock %}

{% block content %}
    <main class="max-w-7xl mx-auto px-4 py-10 w-full">
        <div class="mb-12 text-center">
            <h1 class="text-4xl font-black mb-4 text-white">Search Companies</h1>
            <div class="relative max-w-2xl mx-auto">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="companySearch" onkeyup="filterCompanies()" placeholder="Type company name (e.g. Google, NVIDIA, Zoho)..."
                class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-4 pl-12 pr-4 text-lg text-white focus:outline-none focus:border-blue-500 transition-all shadow-2xl">
            </div>
        </div>

        <div id="companyGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </main>

    <script>
        const grid = document.getElementById('companyGrid');

        fetch('/api/companies/')
            .then(res => res.json())
            .then(data => {
                data.companies.forEach(company => {
                    grid.insertAdjacentHTML('beforeend', `
                    <a href="/question/${encodeURIComponent(company.name)}">
                        <div class="company-card glass p-6 rounded-2xl flex flex-col items-center justify-center text-center hover:border-blue-500 hover:bg-slate-800 transition-all cursor-pointer group border border-transparent">
                            <img src="${company.logo}" alt="${company.name}" class="h-8 mb-4 object-contain group-hover:scale-110 transition-transform">
                            <h3 class="font-bold text-sm tracking-wide text-white">${company.name}</h3>
                        </div>
                    </a>
                    `);
                });
            })
            .catch(err => console.error("API error:", err));

        function filterCompanies() {
            const input = document.getElementById('companySearch').value.toLowerCase();
            const cards = document.getElementsByClassName('company-card');

            Array.from(cards).forEach(card => {
                const name = card.querySelector('h3').innerText.toLowerCase();
                const parentLink = card.closest('a');

                if (name.includes(input)) {
                    parentLink.style.display = "block";
                } else {
                    parentLink.style.display = "none";
                }
            });
        }
    </script>
{% endblock %}
